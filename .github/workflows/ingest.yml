name: ingest

# Polls the sources, dedupes, inserts what is new. Reads feeds and writes rows.
# It never sends anything, so it is safe to leave on the schedule from day one.
#
# Cron on GitHub Actions fires late under load and runs get cancelled. The stage is
# idempotent — its only write is an insert that does nothing on a dedupe_hash
# conflict — so a missed or half-finished run needs no repair.

on:
  # The schedule is deliberately commented out until the Actions secrets exist.
  # A scheduled run with no secrets fails at the first requireString and GitHub
  # emails the owner every time, so leaving this on would have produced a failure
  # notification every 20 minutes before the pipeline had ever worked once.
  #
  # Uncomment after `gh secret set` has been run for:
  #   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, GMAIL_USER, GMAIL_APP_PASSWORD
  # (NOTIFY_EMAIL is optional; alerts fall back to GMAIL_USER.)
  #
  # Hourly rather than every 20 minutes. The original cadence was specified when
  # the system was going to submit applications autonomously, where being first
  # mattered. It cannot — every listing resolves to a manual queue — so a posting
  # found at 09:00 rather than 09:20 makes no difference to when a human applies.
  # Hourly also keeps a private repo comfortably inside the free Actions minutes.
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  # Two overlapping runs would do the same work twice and race on the same rows.
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # No rate floors here. commercial() is lazily evaluated and only
          # assertCommercialEnv() in the process stage forces it, so ingest reads
          # none of them. Listing secrets a workflow never uses is friction at
          # setup time and a lie about what the job depends on.
          # So a failed run can alert rather than failing silently into the log.
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
