name: process

# Scores whatever the ingest stage resolved, then (once step 7 lands) drafts.
#
# Offset half an hour from ingest so the two never contend for the same rows.
# Nothing here sends: dry_run defaults true and there is no send path yet.
#
# Idempotent by status. Rows move resolved -> scored|skipped, so a cancelled run
# leaves the remainder in 'resolved' and the next pass continues from there.

on:
  # The schedule is deliberately commented out until the Actions secrets exist.
  # A scheduled run with no secrets fails at the first requireString and GitHub
  # emails the owner every time, so leaving this on would have produced a failure
  # notification every 20 minutes before the pipeline had ever worked once.
  #
  # Uncomment after `gh secret set` has been run for all of:
  #   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, the scoring provider key,
  #   RATE_FLOOR_HOURLY_USD, RATE_FLOOR_MONTHLY_USD, RATE_FLOOR_JUNIOR_HOURLY_USD,
  #   SCORE_THRESHOLD
  #
  # Hourly rather than every 20 minutes. The original cadence was specified when
  # the system was going to submit applications autonomously, where being first
  # mattered. It cannot — every listing resolves to a manual queue — so a posting
  # found at 09:00 rather than 09:20 makes no difference to when a human applies.
  # Hourly also keeps a private repo comfortably inside the free Actions minutes.
  # schedule:
  #   - cron: '30 * * * *'
  workflow_dispatch:

concurrency:
  # Two overlapping runs would do the same work twice and race on the same rows.
  group: process
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run process
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # The scoring provider. SCORER_PROVIDER selects which key is required;
          # set only the one you are using. A missing key fails before any row is
          # marked, rather than quarantining ten good rows per batch.
          SCORER_PROVIDER: ${{ vars.SCORER_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RATE_FLOOR_HOURLY_USD: ${{ secrets.RATE_FLOOR_HOURLY_USD }}
          RATE_FLOOR_MONTHLY_USD: ${{ secrets.RATE_FLOOR_MONTHLY_USD }}
          RATE_FLOOR_JUNIOR_HOURLY_USD: ${{ secrets.RATE_FLOOR_JUNIOR_HOURLY_USD }}
          SCORE_THRESHOLD: ${{ secrets.SCORE_THRESHOLD }}
          # Alerts on failure go out over Gmail.
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
